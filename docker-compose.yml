x-app: &app
  build: .
  image: auctav-server:latest
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  depends_on:
    redis:
      condition: service_healthy
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  sysctls:
    net.core.somaxconn: 65535
    net.ipv4.ip_local_port_range: "1024 65535"
  mem_limit: 3g
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - auctav-internal
    - traefik-public
  labels:
    - "traefik.enable=true"
    - "traefik.docker.network=traefik-public"
    - "traefik.http.routers.auctav-socket.rule=Host(`socket-auctav.astucom.com`)"
    - "traefik.http.routers.auctav-socket.entrypoints=websecure"
    - "traefik.http.routers.auctav-socket.tls.certresolver=letsencrypt"
    - "traefik.http.services.auctav-socket.loadbalancer.server.port=${APP_PORT}"
    - "traefik.http.services.auctav-socket.loadbalancer.sticky.cookie=true"
    - "traefik.http.services.auctav-socket.loadbalancer.sticky.cookie.name=SERVERID"
    - "traefik.http.services.auctav-socket.loadbalancer.sticky.cookie.httpOnly=true"
    - "traefik.http.services.auctav-socket.loadbalancer.sticky.cookie.secure=true"
    - "traefik.http.services.auctav-socket.loadbalancer.sticky.cookie.samesite=none"
    - "traefik.http.services.auctav-socket.loadbalancer.healthcheck.path=/"
    - "traefik.http.services.auctav-socket.loadbalancer.healthcheck.interval=10s"
    - "traefik.http.services.auctav-socket.loadbalancer.healthcheck.timeout=3s"

x-app-env: &app-env
  NODE_ENV: production
  PORT: ${APP_PORT}
  REDIS_URL: redis://redis:6379
  ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY manquant dans le fichier .env}
  DEBUG_KEY: ${DEBUG_KEY:-}
  NODE_OPTIONS: "--max-old-space-size=2048"
  UV_THREADPOOL_SIZE: "2"

services:
  redis:
    image: redis:7-alpine
    container_name: auctav-redis
    restart: unless-stopped
    cpuset: "4"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxclients
      - "50000"
      - --tcp-backlog
      - "2048"
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
      - --client-output-buffer-limit
      - "pubsub 256mb 64mb 60"
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    mem_limit: 2g
    volumes:
      - redis-data:/data
    networks:
      - auctav-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app1:
    <<: *app
    container_name: auctav-app1
    cpuset: "0"
    environment: { <<: *app-env, INSTANCE_ID: app1 }

  app2:
    <<: *app
    container_name: auctav-app2
    cpuset: "1"
    environment: { <<: *app-env, INSTANCE_ID: app2 }

  app3:
    <<: *app
    container_name: auctav-app3
    cpuset: "2"
    environment: { <<: *app-env, INSTANCE_ID: app3 }

  app4:
    <<: *app
    container_name: auctav-app4
    cpuset: "3"
    environment: { <<: *app-env, INSTANCE_ID: app4 }

networks:
  auctav-internal:
    driver: bridge
  traefik-public:
    external: true

volumes:
  redis-data: